name: Build PlayStorage

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Save installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayStorage-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PlayStorage ${{ steps.ver.outputs.version }}
          body: |
            PlayStorage by sorokin, Windows installer (author: Sorokin Ivan).
            Download the setup.exe file below and run it.
            If Windows shows a blue SmartScreen window: More info, then Run anyway.
          files: src-tauri/target/release/bundle/nsis/*.exe
